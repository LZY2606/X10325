[package]
name = "squashfs-audit"
version = "0.1.0"
edition = "2021"
description = "Read-only SquashFS image provenance auditor"
license = "MIT"

[lib]
name = "squashfs_audit"
path = "src/lib.rs"

[[bin]]
name = "squashfs-audit"
path = "src/main.rs"

[dependencies]
flate2 = { version = "1.0.35", default-features = false, features = ["rust_backend"] }

[profile.release]
lto = "thin"
